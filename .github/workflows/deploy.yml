name: Deploy Lightyar

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Проверки идут до деплоя: без них сломанный контракт доезжает до прода,
  # потому что next build падает только на ошибке компиляции, а не на упавшем тесте.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint app components lib

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy verified commit with rollback and health checks
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd /home/lightyar
            git fetch origin master
            sha='${{ github.sha }}'
            git cat-file -e "$sha^{commit}"
            script=$(mktemp)
            trap 'rm -f "$script"' EXIT
            git show "$sha:scripts/deploy.sh" >"$script"
            bash "$script" "$sha"
