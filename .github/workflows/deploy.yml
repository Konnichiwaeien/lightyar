name: Deploy Lightyar

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Проверки идут до деплоя: без них сломанный контракт доезжает до прода,
  # потому что next build падает только на ошибке компиляции, а не на упавшем тесте.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx eslint app components lib

      - name: Tests
        run: npm test

      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      # CMS credentials live on the VPS. The full build runs there before switching releases.
      - name: Build application code
        run: npm run build -- --experimental-build-mode compile

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
          log-public-key: false

      - name: Deploy verified commit with rollback and health checks
        timeout-minutes: 30
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'EOF'
            set -euo pipefail
            cd /home/apps/lightyar
            git fetch origin master
            sha='${{ github.sha }}'
            git cat-file -e "$sha^{commit}"
            script=$(mktemp)
            trap 'rm -f "$script"' EXIT
            git show "$sha:scripts/deploy.sh" >"$script"
            bash "$script" "$sha"
          EOF

      - name: Verify public release
        timeout-minutes: 3
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 https://lightyar.ru/api/health |
              node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const j=JSON.parse(s);process.exit(j.status==="ok"&&j.release===process.argv[1]?0:1)}catch{process.exit(1)}})' '${{ github.sha }}'; then
              echo 'Public site serves the verified build'
              exit 0
            fi
            sleep 5
          done
          echo 'Public release mismatch; inspect reverse proxy and live process'
          exit 1
